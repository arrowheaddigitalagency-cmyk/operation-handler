services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: cars_compound
      MYSQL_USER: cc
      MYSQL_PASSWORD: ccsecret
    volumes:
      - cc_mysql_data:/var/lib/mysql
    command: ["--default-authentication-plugin=caching_sha2_password", "--character-set-server=utf8mb4"]

volumes:
  cc_mysql_data:
